services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: emaap
      POSTGRES_PASSWORD: emaap_local
      POSTGRES_DB: emaap
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emaap -d emaap"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: emaap_local
      MINIO_ROOT_PASSWORD: emaap_local_storage_password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object_data:/data"]
volumes:
  postgres_data:
  object_data:

